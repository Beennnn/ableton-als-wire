<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="ableton-als-wire — batch-wire plugin parameters to rack macros in an Ableton Live set">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#141a35"/>
      <stop offset="1" stop-color="#1c1030"/>
    </linearGradient>
    <linearGradient id="gM" gradientUnits="userSpaceOnUse" x1="70" y1="100" x2="256" y2="262">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="gR" gradientUnits="userSpaceOnUse" x1="302" y1="0" x2="822" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="gB" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1280" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect x="0" y="352" width="1280" height="8" fill="url(#gB)" opacity="0.85"/>

  <!-- what the repository is, said as a shape -->
  <g transform="translate(70,100)" opacity="0.95">
    <g fill="none" stroke="url(#gM)" stroke-width="2.5">
      <path d="M26 22  C 86 22, 106 62, 166 62"/>
      <path d="M26 79  C 86 79, 106 22, 166 22"/>
      <path d="M26 136 C 86 136, 106 112, 166 112"/>
    </g>
    <g fill="#0e1430" stroke="url(#gM)" stroke-width="2.5">
      <circle cx="14" cy="22" r="11"/>
      <circle cx="14" cy="79" r="11"/>
      <circle cx="14" cy="136" r="11"/>
    </g>
    <g fill="none" stroke="url(#gM)" stroke-width="2.5">
      <rect x="152" y="8"  width="30" height="28" rx="6"/>
      <rect x="152" y="48" width="30" height="28" rx="6"/>
      <rect x="152" y="98" width="30" height="28" rx="6"/>
    </g>
    <rect x="152" y="48" width="30" height="28" rx="6" fill="url(#gM)" filter="url(#glow)"/>  </g>

  <!-- name, one-line subtitle, technical line -->
  <g transform="translate(300,162)">
    <text x="0" y="0" font-family="-apple-system, Segoe UI, sans-serif" font-size="58" font-weight="700" fill="#ffffff" letter-spacing="-0.5">ableton-als-wire</text>
    <rect x="2" y="15" width="520" height="5" rx="2.5" fill="url(#gR)"/>
    <text x="2" y="67" font-family="-apple-system, Segoe UI, sans-serif" font-size="24" fill="#aab4d8">Expose plugin parameters, chain them to rack macros, MIDI-map them.</text>
    <text x="2" y="105" font-family="Menlo, Consolas, monospace" font-size="17" fill="#7f8bb5">batch edit of an Ableton Live .als from a JSON spec  ·  Python 3 stdlib  ·  no GUI</text>
  </g>
</svg>
